name: localvision-apk

# 只为 IDEA-011 出安装包：sideload 跟踪的 debug + candidate 两个变体。
# candidate 包名带 .script 后缀，可与线上 relay 共存。
on:
  workflow_dispatch:
    inputs:
      abi:
        description: '只编单个 ABI（arm64-v8a / armeabi-v7a），留空=全 ABI 通用包'
        required: false
        default: ''
  # 2026-11-13 用户定：只保留手动触发。push 触发会因 assets/localvision 路径误触发，
  # 白白消耗 Actions 额度（实测合并一个 assets 提交就自动跑了一次）。出包一律 workflow_dispatch。

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Install Android SDK platform
        run: |
          set -uo pipefail
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "SDK=$SDK"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SM" --licenses >/dev/null 2>&1 || true
          for pkg in "platforms;android-37.0" "platforms;android-37.1" "platforms;android-37.2" "platforms;android-37"; do
            echo "--- try $pkg"
            if "$SM" "$pkg" >/dev/null 2>&1; then echo "installed $pkg"; break; fi
          done
          "$SM" "platform-tools" >/dev/null 2>&1 || true
          echo "--- installed platforms:"
          ls "$SDK/platforms" || true
          if [ ! -e "$SDK/platforms/android-37" ]; then
            CAND=$(ls -d "$SDK"/platforms/android-37.* 2>/dev/null | head -1 || true)
            if [ -n "$CAND" ]; then ln -sfn "$CAND" "$SDK/platforms/android-37"; echo "linked android-37 -> $CAND"; else echo "no android-37* found"; fi
          fi

      - name: Build sideload debug + candidate
        env:
          ABI: ${{ inputs.abi }}
        run: |
          chmod +x gradlew
          EXTRA=""
          if [ -n "${ABI:-}" ]; then EXTRA="-Phermes.devAbi=${ABI}"; fi
          echo "extra gradle args: $EXTRA"
          ./gradlew :app:assembleSideloadDebug :app:assembleSideloadCandidate --no-daemon --stacktrace \
            -Phermes.versionCode=$((10000 + ${{ github.run_number }})) $EXTRA

      - name: List APKs
        if: always()
        run: find app/build/outputs/apk -name '*.apk' -printf '%p  %s bytes\n' 2>/dev/null || echo "no apk dir"

      - name: Upload to release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-r${{ github.run_number }}
          name: localvision apk r${{ github.run_number }}
          body: |
            自动构建（${{ github.sha }}）ABI=${{ inputs.abi }}
            candidate 变体包名带 .script 后缀，可与现有 relay 共存。
          files: app/build/outputs/apk/**/*.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
